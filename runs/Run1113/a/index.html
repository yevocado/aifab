<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Run1113 — Night Cable (A)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Tweaks: 포인트 컬러 */
  :root { --accent: #f620f0; --accent2: #ff8fa0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .board { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif; color: #fff; }
  .photo { position: absolute; inset: 0; background: url(photo.jpg) center/cover;
    filter: contrast(1.12) saturate(1.25) brightness(.82); }
  .grain { position: absolute; inset: 0; opacity: .22; mix-blend-mode: overlay; }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 52%,
                    rgba(0,0,0,.72) 72%, rgba(0,0,0,.92) 100%); }

  .meta { position: absolute; top: 96px; left: 84px; right: 84px; display: flex;
    justify-content: space-between; font-size: 22px; font-weight: 500; letter-spacing: .42em; }
  .meta span:last-child { letter-spacing: .2em; }

  .block { position: absolute; left: 84px; right: 84px; bottom: 132px; }
  .tick { width: 56px; height: 4px; background: var(--accent); margin-bottom: 28px; }
  .cap { font-size: 22px; font-weight: 500; letter-spacing: .42em; color: rgba(255,255,255,.85); }
  .dist { display: flex; align-items: baseline; margin-top: 6px; }
  .dist .num { font-family: 'Anton'; font-size: 330px; line-height: 1; letter-spacing: -2px; }
  .dist .unit { font-size: 44px; font-weight: 300; margin-left: 18px; color: rgba(255,255,255,.9); }

  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: 36px;
    border-top: 1px solid rgba(255,255,255,.35); padding-top: 30px; }
  .row > div + div { padding-left: 32px; border-left: 1px solid rgba(255,255,255,.2); }
  .row .v { font-family: 'Anton'; line-height: 1; }
  .row .l { margin-top: 12px; font-size: 20px; font-weight: 400; letter-spacing: .3em; color: rgba(255,255,255,.8); }
  .r1 .v { font-size: 76px; } .r2 .v { font-size: 68px; } .r3 .v { font-size: 62px; }

  .foot { margin-top: 56px; font-size: 20px; font-weight: 400; letter-spacing: .36em; color: rgba(255,255,255,.75); }
  .foot b { color: var(--accent2); font-weight: 500; }
</style>
</head>
<body>
<div class="board" id="Run1113">
  <div class="photo"></div>
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="shade"></div>

  <div class="meta"><span>NIGHT CABLE</span><span>11.13 FRI</span></div>

  <div class="block">
    <div class="tick"></div>
    <div class="cap">DISTANCE</div>
    <div class="dist"><span class="num">8.06</span><span class="unit">km</span></div>
    <div class="row">
      <div class="r1"><div class="v">47:10</div><div class="l">TIME</div></div>
      <div class="r2"><div class="v">5'51"</div><div class="l">PACE</div></div>
      <div class="r3"><div class="v">176</div><div class="l">BPM</div></div>
    </div>
    <div class="foot"><b>TEMPO RUN</b>&nbsp;&nbsp;·&nbsp;&nbsp;18:04—18:52&nbsp;&nbsp;·&nbsp;&nbsp;180 SPM</div>
  </div>
</div>
</body>
</html>
