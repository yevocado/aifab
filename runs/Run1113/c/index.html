<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Run1113 — Night Cable (C, kitsch)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@500;900&display=swap" rel="stylesheet">
<style>
  /* Tweaks: 포인트 컬러(사진 마젠타) + 보조(애시드 라임) */
  :root { --accent: #f620f0; --accent2: #d7ff3a; --ink: #111; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; }
  .board { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif; color: var(--ink);
    background:
      radial-gradient(circle, rgba(0,0,0,.18) 22%, transparent 24%) 0 0/28px 28px,
      var(--accent); }
  .board::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 55%, rgba(80,0,90,.35)); }

  /* 상단 띠 */
  .marquee { position: absolute; left: -60px; right: -60px; top: 92px; height: 86px; transform: rotate(-4deg);
    background: var(--ink); color: var(--accent2); border-top: 6px solid var(--accent2); border-bottom: 6px solid var(--accent2);
    font-family: 'Anton'; font-size: 52px; line-height: 74px; letter-spacing: 4px; white-space: nowrap; overflow: hidden; z-index: 2; }

  /* 사진 스티커 */
  .pic { position: absolute; left: 270px; top: 250px; width: 700px; height: 900px; transform: rotate(5deg);
    background: #fff; padding: 22px 22px 90px; box-shadow: 16px 18px 0 var(--ink); z-index: 1; }
  .pic .img { width: 100%; height: 100%; background: url(photo.jpg) center/cover;
    filter: contrast(1.15) saturate(1.35); }
  .pic .cap { position: absolute; left: 30px; bottom: 22px; font-weight: 900; font-size: 40px; letter-spacing: -1px; }
  .tape { position: absolute; width: 190px; height: 58px; background: rgba(215,255,58,.82); z-index: 3; }

  /* 거리 */
  .dist { position: absolute; left: 30px; top: 880px; z-index: 4; transform: rotate(-6deg); }
  .num { font-family: 'Anton'; font-size: 420px; line-height: .95; letter-spacing: -6px;
    color: var(--accent2); -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill;
    text-shadow: 16px 16px 0 var(--ink); }
  .km { position: absolute; right: -150px; bottom: 60px; background: var(--ink); color: #fff;
    font-family: 'Anton'; font-size: 78px; padding: 6px 26px 2px; border-radius: 60px; transform: rotate(8deg); }

  /* 버스트 */
  .burst { position: absolute; left: 40px; top: 300px; width: 330px; height: 330px; z-index: 5; transform: rotate(-12deg); }
  .burst span { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Anton'; font-size: 62px; line-height: .95; text-align: center; color: var(--ink); }
  .burst small { font-family: 'Noto Sans KR'; font-weight: 900; font-size: 28px; margin-top: 8px; }

  /* 기록 스티커 */
  .tag { position: absolute; display: flex; align-items: baseline; gap: 18px; background: #fff;
    border: 6px solid var(--ink); border-radius: 26px; box-shadow: 10px 10px 0 var(--ink); padding: 10px 34px 14px; z-index: 4; }
  .tag b { font-family: 'Anton'; font-weight: 400; line-height: 1; }
  .tag i { font-style: normal; font-weight: 900; font-size: 30px; }
  .t1 { left: 60px; top: 1390px; transform: rotate(-3deg); } .t1 b { font-size: 140px; }
  .t2 { left: 560px; top: 1560px; transform: rotate(4deg); background: var(--accent2); } .t2 b { font-size: 112px; }
  .t3 { left: 80px; top: 1600px; transform: rotate(2deg); } .t3 b { font-size: 96px; }

  /* 티켓 */
  .ticket { position: absolute; right: 70px; top: 1712px; width: 420px; padding: 22px 30px; background: var(--ink); color: #fff;
    transform: rotate(-5deg); z-index: 4;
    -webkit-mask: radial-gradient(circle at 0 50%, transparent 22px, #000 23px) left/51% 100% no-repeat,
                  radial-gradient(circle at 100% 50%, transparent 22px, #000 23px) right/51% 100% no-repeat; }
  .ticket .a { font-family: 'Anton'; font-size: 58px; color: var(--accent2); letter-spacing: 1px; }
  .ticket .b { font-weight: 500; font-size: 26px; letter-spacing: .12em; margin-top: 4px; }

  .spark { position: absolute; z-index: 6; }
</style>
</head>
<body>
<div class="board" id="Run1113">
  <div class="marquee">NIGHT CABLE ★ 2026.11.13 FRI ★ NIGHT CABLE ★ 2026.11.13 FRI ★ NIGHT CABLE</div>

  <div class="pic"><div class="img"></div></div>
  <div class="tape" style="left:780px;top:228px;transform:rotate(32deg)"></div>
  <div class="tape" style="left:250px;top:1080px;transform:rotate(-28deg)"></div>

  <svg class="burst" viewBox="0 0 200 200">
    <polygon fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"
      points="100,4 116,42 152,18 146,60 192,58 160,90 196,118 152,124 168,166 128,148 116,194 98,156 72,190 66,146 22,166 40,124 4,108 42,86 12,52 58,56 50,12 84,40"/>
  </svg>
  <div class="burst"><span>TEMPO<br>RUN<small>템포런</small></span></div>

  <div class="dist"><div class="num">8.06</div><div class="km">KM</div></div>

  <div class="tag t1"><b>47:10</b><i>운동 시간</i></div>
  <div class="tag t2"><b>5'51"</b><i>페이스</i></div>
  <div class="tag t3"><b>176</b><i>bpm 심박</i></div>

  <div class="ticket"><div class="a">18:04 → 18:52</div><div class="b">CADENCE 180 SPM</div></div>

  <svg class="spark" style="left:940px;top:170px" width="90" height="90" viewBox="0 0 100 100"><path d="M50 0 C55 40 60 45 100 50 C60 55 55 60 50 100 C45 60 40 55 0 50 C40 45 45 40 50 0Z" fill="#d7ff3a" stroke="#111" stroke-width="4"/></svg>
  <svg class="spark" style="left:880px;top:1300px" width="120" height="120" viewBox="0 0 100 100"><path d="M50 0 C55 40 60 45 100 50 C60 55 55 60 50 100 C45 60 40 55 0 50 C40 45 45 40 50 0Z" fill="#fff" stroke="#111" stroke-width="4"/></svg>
  <svg class="spark" style="left:60px;top:1800px" width="70" height="70" viewBox="0 0 100 100"><path d="M50 0 C55 40 60 45 100 50 C60 55 55 60 50 100 C45 60 40 55 0 50 C40 45 45 40 50 0Z" fill="#d7ff3a" stroke="#111" stroke-width="5"/></svg>
</div>
</body>
</html>
