<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Run1113 — Night Cable (B)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Tweaks: 포인트 컬러 */
  :root { --accent: #f620f0; --accent2: #ff8fa0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0c; }
  .board { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif; color: #fff; background: #0a0a0c; }
  .frame { position: absolute; left: 72px; top: 150px; width: 936px; height: 1130px; overflow: hidden; }
  .photo { position: absolute; inset: 0; background: url(photo.jpg) center/cover;
    filter: contrast(1.12) saturate(1.25) brightness(.85); }
  .grain { position: absolute; inset: 0; opacity: .2; mix-blend-mode: overlay; }

  .head { position: absolute; top: 70px; left: 72px; right: 72px; display: flex; justify-content: space-between;
    font-size: 22px; font-weight: 500; letter-spacing: .42em; }
  .head span:last-child { letter-spacing: .2em; color: rgba(255,255,255,.8); }

  /* 사진 아래로 넘쳐 내려오는 거리 숫자 */
  .dist { position: absolute; left: 56px; top: 1120px; display: flex; align-items: baseline; }
  .num { font-family: 'Anton'; font-size: 340px; line-height: 1; letter-spacing: -3px; }
  .unit { margin-left: 22px; font-size: 44px; font-weight: 300; border-top: 4px solid var(--accent); padding-top: 10px; }

  .row { position: absolute; left: 72px; right: 72px; top: 1560px; display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .row > div + div { padding-left: 32px; border-left: 1px solid rgba(255,255,255,.2); }
  .row .v { font-family: 'Anton'; line-height: 1; }
  .row .l { margin-top: 12px; font-size: 20px; letter-spacing: .3em; color: rgba(255,255,255,.75); }
  .r1 .v { font-size: 76px; } .r2 .v { font-size: 68px; } .r3 .v { font-size: 62px; }

  .foot { position: absolute; left: 72px; right: 72px; bottom: 110px; display: flex; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,.25); padding-top: 26px;
    font-size: 20px; letter-spacing: .32em; color: rgba(255,255,255,.75); }
  .foot b { color: var(--accent2); font-weight: 500; }
</style>
</head>
<body>
<div class="board" id="Run1113">
  <div class="head"><span>NIGHT CABLE</span><span>2026.11.13</span></div>
  <div class="frame">
    <div class="photo"></div>
    <svg class="grain" width="936" height="1130"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  </div>
  <div class="dist"><span class="num">8.06</span><span class="unit">km</span></div>
  <div class="row">
    <div class="r1"><div class="v">47:10</div><div class="l">TIME</div></div>
    <div class="r2"><div class="v">5'51"</div><div class="l">PACE</div></div>
    <div class="r3"><div class="v">176</div><div class="l">BPM</div></div>
  </div>
  <div class="foot"><b>TEMPO RUN</b><span>18:04—18:52 · 180 SPM</span></div>
</div>
</body>
</html>
